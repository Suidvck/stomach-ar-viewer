  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      font-family: 'Inter', 'Noto Sans Thai', sans-serif;
      background-color: #000000;
      color: #f8fafc;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
    }
    #ar-container {
      isolation: isolate;
      z-index: 1;
    }
    #ar-container video {
      position: absolute !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      max-width: none !important;
      max-height: none !important;
      object-fit: cover !important;
      z-index: 1 !important;
    }
    #ar-container canvas {
      position: absolute !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      max-width: none !important;
      max-height: none !important;
      z-index: 2 !important;
      pointer-events: none;
    }
    .callout-pill {
      transition: transform 0.18s ease, opacity 0.2s ease, border-color 0.2s ease;
    }
    .callout-pill:hover {
      transform: translate(-50%, -50%) scale(1.04) !important;
      border-color: rgba(251, 113, 133, 0.7);
    }
  </style>

    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/gltf/');
    const gltfLoader = new GLTFLoader();
    gltfLoader.setDRACOLoader(dracoLoader);

    function normalizeModel(gltfScene) {
      const box = new THREE.Box3().setFromObject(gltfScene);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z) || 1;
      const scale = 0.72 / maxDim;

      const wrapper = new THREE.Group();
      const model = gltfScene.clone(true);
      model.scale.setScalar(scale);
      model.position.set(-center.x * scale, -center.y * scale, -center.z * scale);
      wrapper.add(model);
      return wrapper;
    }

    // Build per-organ state, callouts, and load all 3 GLB models
    const svgNS = 'http://www.w3.org/2000/svg';
    const organStates = ORGANS.map((organ) => {
      const group = new THREE.Group();
      group.position.set(0, 0, 0.32);

      const callouts = organ.annotations.map((item) => {
        const line = document.createElementNS(svgNS, 'polyline');
        line.setAttribute('fill', 'none');
        line.setAttribute('stroke', organ.accentColor);
        line.setAttribute('stroke-opacity', '0.88');
        line.setAttribute('stroke-width', '1.75');
        line.setAttribute('stroke-linecap', 'round');
        line.setAttribute('stroke-linejoin', 'round');
        line.style.display = 'none';
        calloutSvg.appendChild(line);

        const dot = document.createElementNS(svgNS, 'circle');
        dot.setAttribute('r', '4');
        dot.setAttribute('fill', organ.accentColor);
        dot.setAttribute('stroke', '#ffffff');
        dot.setAttribute('stroke-width', '1.5');
        dot.style.display = 'none';
        calloutSvg.appendChild(dot);

        const pill = document.createElement('button');
        pill.type = 'button';
        pill.className = 'callout-pill pointer-events-auto absolute px-2.5 py-1 rounded-full bg-slate-950/75 border border-white/20 backdrop-blur-md text-left shadow-lg flex items-center gap-1.5';
        pill.style.display = 'none';
        pill.innerHTML = `<span class="w-1.5 h-1.5 rounded-full shrink-0" style="background:${organ.accentColor}"></span><span class="text-[11px] font-medium text-white whitespace-nowrap">${item.title}</span>`;
        pill.addEventListener('click', () => openInfoCard(item));
        calloutLabels.appendChild(pill);

        const anchorObj = new THREE.Object3D();
        anchorObj.position.copy(item.localPos);

        return { item, line, dot, pill, anchorObj };
      });

      const state = {
        organ,
        group,
        callouts,
        found: false,
        loaded: false,
        popProgress: 0,
      };

      gltfLoader.load(
        organ.glbUrl,
        (gltf) => {
          const wrapped = normalizeModel(gltf.scene);
          wrapped.rotation.x = Math.PI / 2;
          callouts.forEach((c) => wrapped.add(c.anchorObj));
          group.add(wrapped);
          state.loaded = true;
          state.popProgress = 0;
        },
        undefined,
        (err) => console.error(`Load error (${organ.name}):`, err)
      );

      return state;
    });

    function easeOutBack(x) {
      const c1 = 1.70158;
      const c3 = c1 + 1;
      return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
    }

    const tempVec = new THREE.Vector3();
    function updateAllCallouts(camera, width, height) {
      const isCompact = width < 480;
      const scaleFactor = isCompact ? 0.78 : 1;

      organStates.forEach((st) => {
        const active = showLabels && st.loaded && st.found;
        st.callouts.forEach(({ item, line, dot, pill, anchorObj }) => {
          if (!active) {
            line.style.display = 'none';
            dot.style.display = 'none';
            pill.style.display = 'none';
            return;
          }

          anchorObj.updateWorldMatrix(true, false);
          tempVec.setFromMatrixPosition(anchorObj.matrixWorld);
          tempVec.project(camera);

          if (tempVec.z > 1) {
            line.style.display = 'none';
            dot.style.display = 'none';
            pill.style.display = 'none';
            return;
          }

          const sx = (tempVec.x * 0.5 + 0.5) * width;
          const sy = (-tempVec.y * 0.5 + 0.5) * height;
          const ox = item.offset.x * scaleFactor;
          const oy = item.offset.y * scaleFactor;
          const lx = Math.max(74, Math.min(width - 74, sx + ox));
          const ly = Math.max(70, Math.min(height - 78, sy + oy));
          const elbowX = sx + (lx - sx) * 0.55;

          line.style.display = '';
          dot.style.display = '';
          pill.style.display = '';

          dot.setAttribute('cx', sx.toFixed(1));
          dot.setAttribute('cy', sy.toFixed(1));
          line.setAttribute('points', `${sx.toFixed(1)},${sy.toFixed(1)} ${elbowX.toFixed(1)},${ly.toFixed(1)} ${lx.toFixed(1)},${ly.toFixed(1)}`);

          pill.style.left = `${lx.toFixed(1)}px`;
          pill.style.top = `${ly.toFixed(1)}px`;
          pill.style.transform = 'translate(-50%, -50%)';
        });
      });
    }

    function refreshStatusBanner() {
      const activeNames = organStates.filter((s) => s.found).map((s) => s.organ.name);
      if (activeNames.length > 0) {
        setStatus(activeNames.join(' + '), 'แตะป้ายชี้เพื่อดูข้อมูล', 'bg-emerald-400');
      } else {
        setStatus('ระบบย่อยอาหาร', 'ส่องกล้องไปที่การ์ด (กระเพาะ / ตับอ่อน / ลำไส้เล็ก)', 'bg-sky-400 animate-pulse');
      }
    }

    function idbGet(key) {
      return new Promise((resolve) => {
        try {
          const req = indexedDB.open('stomach_ar_cache', 1);
          req.onupgradeneeded = () => req.result.createObjectStore('kv');
          req.onsuccess = () => {
            const tx = req.result.transaction('kv', 'readonly');
            const g = tx.objectStore('kv').get(key);
            g.onsuccess = () => resolve(g.result || null);
            g.onerror = () => resolve(null);
          };
          req.onerror = () => resolve(null);
        } catch { resolve(null); }
      });
    }
    function idbSet(key, val) {
      try {
        const req = indexedDB.open('stomach_ar_cache', 1);
        req.onupgradeneeded = () => req.result.createObjectStore('kv');
        req.onsuccess = () => {
          const tx = req.result.transaction('kv', 'readwrite');
          tx.objectStore('kv').put(val, key);
        };
      } catch {}
    }

    async function ensureCompiledMind() {
      if (compiledMindBlobUrl) return compiledMindBlobUrl;
      setStatus('ระบบย่อยอาหาร', 'กำลังเตรียมข้อมูลการ์ด 3 ใบ...', 'bg-amber-400 animate-pulse');

      const cached = await idbGet('digestive_mind_v3');
      if (cached) {
        const blob = new Blob([cached], { type: 'application/octet-stream' });
        compiledMindBlobUrl = URL.createObjectURL(blob);
        return compiledMindBlobUrl;
      }

      const imgs = await Promise.all(
        ORGANS.map((o) => {
          const el = document.getElementById(o.imgId);
          if (el.complete) return Promise.resolve(el);
          return new Promise((resolve) => {
            el.onload = () => resolve(el);
          });
        })
      );

      const compiler = new Compiler();
      await compiler.compileImageTargets(imgs, (progress) => {
        const pct = Math.round(progress);
        setStatus('ระบบย่อยอาหาร', `ประมวลผลการ์ด 3 ใบ ${pct}%`, 'bg-amber-400 animate-pulse');
      });

      const buf = await compiler.exportData();
      idbSet('digestive_mind_v3', buf);
      const blob = new Blob([buf], { type: 'application/octet-stream' });
      compiledMindBlobUrl = URL.createObjectURL(blob);
      return compiledMindBlobUrl;
    }

    let lastTime = performance.now();
    async function startARMode() {
      arErrorCard.classList.add('hidden');
      try {
        if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) {
          throw new Error('ต้องเปิดผ่าน HTTPS หรือ localhost');
        }
        const mindUrl = await ensureCompiledMind();

        if (!mindarThree) {
          mindarThree = new MindARThree({
            container: arContainer,
            imageTargetSrc: mindUrl,
            maxTrack: 3,
            filterMinCF: 0.005,
            filterBeta: 0.05,
            warmupTolerance: 1,
            missTolerance: 3,
            uiLoading: 'no',
            uiScanning: 'no',
          });

          const { renderer, scene, camera } = mindarThree;
          renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
          renderer.outputColorSpace = THREE.SRGBColorSpace;
          renderer.setClearColor(0x000000, 0);

          scene.add(new THREE.HemisphereLight(0xffffff, 0x334155, 1.5));
          const arDir = new THREE.DirectionalLight(0xffffff, 1.4);
          arDir.position.set(1, 2, 2);
          scene.add(arDir);

          organStates.forEach((st) => {
            const anchor = mindarThree.addAnchor(st.organ.index);
            anchor.group.add(st.group);
            anchor.onTargetFound = () => {
              st.found = true;
              st.popProgress = 0;
              refreshStatusBanner();
            };
            anchor.onTargetLost = () => {
              st.found = false;
              refreshStatusBanner();
            };
          });

          setStatus('ระบบย่อยอาหาร', 'กำลังเปิดกล้อง...', 'bg-amber-400 animate-pulse');
          await mindarThree.start();
          arStarted = true;
          refreshStatusBanner();

          renderer.setAnimationLoop(() => {
            const now = performance.now();
            const dt = Math.min(0.05, (now - lastTime) / 1000);
            lastTime = now;

            organStates.forEach((st) => {
              if (st.popProgress < 1) {
                st.popProgress = Math.min(1, st.popProgress + dt * 2.4);
              }
              const scale = Math.max(0.001, easeOutBack(st.popProgress));
              st.group.scale.setScalar(scale);
              if (autoSpin && st.found) {
                st.group.rotation.z += dt * 0.8;
              }
            });

            renderer.render(scene, camera);
            updateAllCallouts(camera, arContainer.clientWidth, arContainer.clientHeight);
          });
        } else if (!arStarted) {
          await mindarThree.start();
          arStarted = true;
          refreshStatusBanner();
        }
      } catch (err) {
        setStatus('ระบบย่อยอาหาร', 'รอการอนุญาตเปิดกล้อง', 'bg-rose-500');
        arErrorDetail.textContent = 'เบราว์เซอร์ต้องการการกดปุ่มเพื่ออนุญาตเปิดกล้อง (' + (err?.message || 'Permission required') + ')';
        arErrorCard.classList.remove('hidden');
      }
    }

    btnRetryAr.addEventListener('click', startARMode);
    btnPopReplay.addEventListener('click', () => {
      organStates.forEach((st) => {
        if (st.found) st.popProgress = 0;
      });
    });

    btnToggleSpin.addEventListener('click', () => {
      autoSpin = !autoSpin;
      btnToggleSpin.textContent = `หมุน: ${autoSpin ? 'เปิด' : 'ปิด'}`;
    });

    btnToggleLabels.addEventListener('click', () => {
      showLabels = !showLabels;
      btnToggleLabels.textContent = `ป้ายชี้: ${showLabels ? 'เปิด' : 'ปิด'}`;
      btnToggleLabels.className = showLabels
        ? 'px-3.5 py-1.5 rounded-full bg-white/15 hover:bg-white/20 text-xs font-medium text-white transition whitespace-nowrap'
        : 'px-3.5 py-1.5 rounded-full bg-white/5 hover:bg-white/15 text-xs font-medium text-slate-300 transition whitespace-nowrap';
      if (!showLabels) infoCard.classList.add('hidden');
    });

    window.addEventListener('load', startARMode);
  </script>
</body>
</html>
