      dot.setAttribute('fill', '#fb7185');
      dot.setAttribute('stroke', '#ffffff');
      dot.setAttribute('stroke-width', '1.5');
      calloutSvg.appendChild(dot);

      const pill = document.createElement('button');
      pill.type = 'button';
      pill.className = 'callout-pill pointer-events-auto absolute px-2.5 py-1 rounded-full bg-slate-950/75 border border-white/20 backdrop-blur-md text-left shadow-lg flex items-center gap-1.5';
      pill.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-rose-400 shrink-0"></span><span class="text-[11px] font-medium text-white whitespace-nowrap">${item.title}</span>`;
      pill.addEventListener('click', () => openInfoCard(item));
      calloutLabels.appendChild(pill);

      const previewAnchor = new THREE.Object3D();
      previewAnchor.position.copy(item.localPos);

      const arAnchor = new THREE.Object3D();
      arAnchor.position.copy(item.localPos);

      return { item, line, dot, pill, previewAnchor, arAnchor };
    });

    // --- 1. Three.js Preview Scene ---
    const previewScene = new THREE.Scene();
    previewScene.background = new THREE.Color('#090d16');

    const previewCamera = new THREE.PerspectiveCamera(
      42,
      previewContainer.clientWidth / Math.max(1, previewContainer.clientHeight),
      0.1,
      100
    );
    previewCamera.position.set(0.75, 1.05, 1.55);

    const previewRenderer = new THREE.WebGLRenderer({ antialias: true });
    previewRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    previewRenderer.setSize(previewContainer.clientWidth, previewContainer.clientHeight);
    previewRenderer.outputColorSpace = THREE.SRGBColorSpace;
    previewContainer.appendChild(previewRenderer.domElement);

    const controls = new OrbitControls(previewCamera, previewRenderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 0.32, 0);

    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x334155, 1.5);
    previewScene.add(hemiLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
    dirLight.position.set(2, 4, 2);
    previewScene.add(dirLight);
    const rimLight = new THREE.DirectionalLight(0xffe4e6, 0.75);
    rimLight.position.set(-2, 2, -2);
    previewScene.add(rimLight);

    const grid = new THREE.GridHelper(4, 16, 0x1e293b, 0x111827);
    previewScene.add(grid);

    // Card plane using target image texture
    const cardAspect = 520 / 660;
    const cardGeo = new THREE.PlaneGeometry(cardAspect, 1);
    const textureLoader = new THREE.TextureLoader();
    const cardTexture = textureLoader.load(targetImgEl.src);
    cardTexture.colorSpace = THREE.SRGBColorSpace;
    const cardMat = new THREE.MeshStandardMaterial({ map: cardTexture, roughness: 0.65 });
    const cardMesh = new THREE.Mesh(cardGeo, cardMat);
    cardMesh.rotation.x = -Math.PI / 2;
    cardMesh.position.y = 0.004;
    previewScene.add(cardMesh);

    const previewModelGroup = new THREE.Group();
    previewModelGroup.position.set(0, 0.42, 0);
    previewScene.add(previewModelGroup);

    const arModelGroup = new THREE.Group();
    arModelGroup.position.set(0, 0, 0.32);

    function normalizeAndCloneModel(gltfScene) {
      const box = new THREE.Box3().setFromObject(gltfScene);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z) || 1;
      const scale = 0.72 / maxDim;

      const wrapper = new THREE.Group();
      const model = gltfScene.clone(true);
      model.scale.setScalar(scale);
      model.position.set(-center.x * scale, -center.y * scale, -center.z * scale);
      wrapper.add(model);
      return wrapper;
    }

    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/gltf/');
    const gltfLoader = new GLTFLoader();
    gltfLoader.setDRACOLoader(dracoLoader);

    gltfLoader.load(
      STOMACH_GLB_URL,
      (gltf) => {
        const previewWrapped = normalizeAndCloneModel(gltf.scene);
        const arWrapped = normalizeAndCloneModel(gltf.scene);
        arWrapped.rotation.x = Math.PI / 2;

        calloutRefs.forEach((ref) => {
          previewWrapped.add(ref.previewAnchor);
          arWrapped.add(ref.arAnchor);
        });

        previewModelGroup.add(previewWrapped);
        arModelGroup.add(arWrapped);
        modelLoaded = true;
        triggerPopAnimation();
        if (currentMode === 'preview') {
          setStatus('แตะป้ายชี้เพื่ออ่านข้อมูลได้', 'bg-emerald-400');
        }
      },
      undefined,
      (err) => {
        setStatus('โหลดโมเดลไม่สำเร็จ', 'bg-rose-500');
        console.error(err);
      }
    );

    function triggerPopAnimation() {
      popProgress = 0;
    }

    function easeOutBack(x) {
      const c1 = 1.70158;
      const c3 = c1 + 1;
      return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
    }

    const tempVec = new THREE.Vector3();
    function updateCallouts(camera, width, height) {
      const visible = showLabels && modelLoaded && (currentMode === 'preview' || isTargetFound);
      calloutLayer.style.opacity = visible ? '1' : '0';
      if (!visible) return;

      const isCompact = width < 480;
      const scaleFactor = isCompact ? 0.78 : 1;

      calloutRefs.forEach(({ item, line, dot, pill, previewAnchor, arAnchor }) => {
        const anchorObj = currentMode === 'preview' ? previewAnchor : arAnchor;
        anchorObj.updateWorldMatrix(true, false);
        tempVec.setFromMatrixPosition(anchorObj.matrixWorld);
        tempVec.project(camera);

        if (tempVec.z > 1) {
          line.style.display = 'none';
          dot.style.display = 'none';
          pill.style.display = 'none';
          return;
        }

        const sx = (tempVec.x * 0.5 + 0.5) * width;
        const sy = (-tempVec.y * 0.5 + 0.5) * height;

        const ox = item.offset.x * scaleFactor;
        const oy = item.offset.y * scaleFactor;
        const lx = Math.max(74, Math.min(width - 74, sx + ox));
        const ly = Math.max(70, Math.min(height - 78, sy + oy));
        const elbowX = sx + (lx - sx) * 0.55;

        line.style.display = '';
        dot.style.display = '';
        pill.style.display = '';

        dot.setAttribute('cx', sx.toFixed(1));
        dot.setAttribute('cy', sy.toFixed(1));
        line.setAttribute('points', `${sx.toFixed(1)},${sy.toFixed(1)} ${elbowX.toFixed(1)},${ly.toFixed(1)} ${lx.toFixed(1)},${ly.toFixed(1)}`);

        pill.style.left = `${lx.toFixed(1)}px`;
        pill.style.top = `${ly.toFixed(1)}px`;
        pill.style.transform = 'translate(-50%, -50%)';
      });
    }

    let lastTime = performance.now();
    function animate(now) {
      requestAnimationFrame(animate);
      const dt = Math.min(0.05, (now - lastTime) / 1000);
      lastTime = now;

      if (popProgress < 1) {
        popProgress = Math.min(1, popProgress + dt * 2.4);
      }
      const scale = Math.max(0.001, easeOutBack(popProgress));
      previewModelGroup.scale.setScalar(scale);
      arModelGroup.scale.setScalar(scale);

      if (autoSpin) {
        previewModelGroup.rotation.y += dt * 0.8;
        arModelGroup.rotation.z += dt * 0.8;
      }

      if (currentMode === 'preview') {
        controls.update();
        previewRenderer.render(previewScene, previewCamera);
        updateCallouts(previewCamera, previewContainer.clientWidth, previewContainer.clientHeight);
      }
    }
    requestAnimationFrame(animate);

    window.addEventListener('resize', () => {
      if (currentMode === 'preview') {
        const w = previewContainer.clientWidth;
        const h = Math.max(1, previewContainer.clientHeight);
        previewCamera.aspect = w / h;
        previewCamera.updateProjectionMatrix();
        previewRenderer.setSize(w, h);
      }
    });

    // --- 2. IndexedDB Cache + Compile Target Image to .mind ---
    function idbGet(key) {
      return new Promise((resolve) => {
        try {
          const req = indexedDB.open('stomach_ar_cache', 1);
          req.onupgradeneeded = () => req.result.createObjectStore('kv');
          req.onsuccess = () => {
            const tx = req.result.transaction('kv', 'readonly');
            const g = tx.objectStore('kv').get(key);
            g.onsuccess = () => resolve(g.result || null);
            g.onerror = () => resolve(null);
          };
          req.onerror = () => resolve(null);
        } catch { resolve(null); }
      });
    }
    function idbSet(key, val) {
      try {
        const req = indexedDB.open('stomach_ar_cache', 1);
        req.onupgradeneeded = () => req.result.createObjectStore('kv');
        req.onsuccess = () => {
          const tx = req.result.transaction('kv', 'readwrite');
          tx.objectStore('kv').put(val, key);
        };
      } catch {}
    }

    async function ensureCompiledMind() {
      if (compiledMindBlobUrl) return compiledMindBlobUrl;
      setStatus('กำลังเตรียมข้อมูลการ์ด...', 'bg-amber-400 animate-pulse');

      const cached = await idbGet('stomach_mind_v2');
      if (cached) {
        const blob = new Blob([cached], { type: 'application/octet-stream' });
        compiledMindBlobUrl = URL.createObjectURL(blob);
        return compiledMindBlobUrl;
      }

      if (!targetImgEl.complete) {
        await new Promise((resolve) => {
          targetImgEl.onload = resolve;
        });
      }

      const compiler = new Compiler();
      await compiler.compileImageTargets([targetImgEl], (progress) => {
        const pct = Math.round(progress);
        setStatus(`ประมวลผลการ์ด ${pct}%`, 'bg-amber-400 animate-pulse');
      });

      const buf = await compiler.exportData();
      idbSet('stomach_mind_v2', buf);
      const blob = new Blob([buf], { type: 'application/octet-stream' });
      compiledMindBlobUrl = URL.createObjectURL(blob);
      return compiledMindBlobUrl;
    }

    // --- 3. Start / Stop MindAR Camera Mode ---
    async function startARMode() {
      currentMode = 'ar';
      isTargetFound = false;
      infoCard.classList.add('hidden');
      arErrorCard.classList.add('hidden');
      previewContainer.classList.add('hidden');
      arContainer.classList.remove('hidden');
      btnModeAr.className = 'px-3.5 py-1 text-xs font-medium rounded-full bg-rose-500 text-white shadow-sm transition';
      btnModePreview.className = 'px-3.5 py-1 text-xs font-medium rounded-full text-slate-300 hover:text-white transition';

      try {
        if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) {
          throw new Error('ต้องเปิดผ่าน HTTPS หรือ localhost');
        }
        const mindUrl = await ensureCompiledMind();
        if (currentMode !== 'ar') return;

        if (!mindarThree) {
          mindarThree = new MindARThree({
            container: arContainer,
            imageTargetSrc: mindUrl,
            filterMinCF: 0.005,
            filterBeta: 0.05,
            warmupTolerance: 1,
            missTolerance: 3,
            uiLoading: 'no',
            uiScanning: 'no',
          });

          const { renderer, scene, camera } = mindarThree;
          renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
          renderer.outputColorSpace = THREE.SRGBColorSpace;
          scene.add(new THREE.HemisphereLight(0xffffff, 0x334155, 1.5));
          const arDir = new THREE.DirectionalLight(0xffffff, 1.4);
          arDir.position.set(1, 2, 2);
          scene.add(arDir);

          const anchor = mindarThree.addAnchor(0);
          anchor.group.add(arModelGroup);

          anchor.onTargetFound = () => {
            isTargetFound = true;
            triggerPopAnimation();
            setStatus('พบการ์ดแล้ว • แตะป้ายชี้เพื่อดูข้อมูล', 'bg-emerald-400');
          };
          anchor.onTargetLost = () => {
            isTargetFound = false;
            setStatus('ส่องกล้องไปที่การ์ดกระเพาะอาหาร', 'bg-sky-400 animate-pulse');
          };

          setStatus('กำลังเปิดกล้อง...', 'bg-amber-400 animate-pulse');
          await mindarThree.start();
          arStarted = true;
          setStatus('ส่องกล้องไปที่การ์ดกระเพาะอาหาร', 'bg-sky-400 animate-pulse');

          renderer.setAnimationLoop(() => {
            renderer.render(scene, camera);
            if (currentMode === 'ar') {
              updateCallouts(camera, arContainer.clientWidth, arContainer.clientHeight);
            }
          });
        } else if (!arStarted) {
          await mindarThree.start();
          arStarted = true;
          setStatus('ส่องกล้องไปที่การ์ดกระเพาะอาหาร', 'bg-sky-400 animate-pulse');
        }
      } catch (err) {
        setStatus('เปิดกล้องไม่สำเร็จ', 'bg-rose-500');
        arErrorDetail.textContent = 'เบราว์เซอร์หรือหน้าต่างนี้ไม่อนุญาตให้ใช้กล้อง (' + (err?.message || 'Permission denied') + ')';
        arErrorCard.classList.remove('hidden');
      }
    }

    function switchToPreviewMode() {
      currentMode = 'preview';
      isTargetFound = false;
      infoCard.classList.add('hidden');
      arErrorCard.classList.add('hidden');
      if (mindarThree && arStarted) {
        try {
          mindarThree.stop();
        } catch (e) {}
        arStarted = false;
      }
      arContainer.classList.add('hidden');
      previewContainer.classList.remove('hidden');
      btnModePreview.className = 'px-3.5 py-1 text-xs font-medium rounded-full bg-rose-500 text-white shadow-sm transition';
      btnModeAr.className = 'px-3.5 py-1 text-xs font-medium rounded-full text-slate-300 hover:text-white transition';
      setStatus(modelLoaded ? 'แตะป้ายชี้เพื่ออ่านข้อมูลได้' : 'กำลังโหลดโมเดล...', modelLoaded ? 'bg-emerald-400' : 'bg-amber-400 animate-pulse');

      const w = previewContainer.clientWidth;
      const h = Math.max(1, previewContainer.clientHeight);
      previewCamera.aspect = w / h;
      previewCamera.updateProjectionMatrix();
      previewRenderer.setSize(w, h);
    }

    // --- 4. UI Event Listeners ---
    btnModePreview.addEventListener('click', switchToPreviewMode);
    btnModeAr.addEventListener('click', startARMode);
    btnBackPreview.addEventListener('click', switchToPreviewMode);
    btnRetryAr.addEventListener('click', startARMode);

    btnPopReplay.addEventListener('click', triggerPopAnimation);

    btnToggleSpin.addEventListener('click', () => {
      autoSpin = !autoSpin;
      btnToggleSpin.textContent = `หมุน: ${autoSpin ? 'เปิด' : 'ปิด'}`;
    });

    btnToggleLabels.addEventListener('click', () => {
      showLabels = !showLabels;
      btnToggleLabels.textContent = `ป้ายชี้: ${showLabels ? 'เปิด' : 'ปิด'}`;
      btnToggleLabels.className = showLabels
        ? 'px-3.5 py-1.5 rounded-full bg-white/15 hover:bg-white/20 text-xs font-medium text-white transition whitespace-nowrap'
        : 'px-3.5 py-1.5 rounded-full bg-white/5 hover:bg-white/15 text-xs font-medium text-slate-300 transition whitespace-nowrap';
      if (!showLabels) infoCard.classList.add('hidden');
    });
  </script>
</body>
</html>
